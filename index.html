var COLS=[["E","id"],["T","id"],["L","id"],["P","id"],["N","id"],["C","id"],["PJ","n"]],BASE=null,SV=0,dirty=0,inflight=0,ftimer=0;

function mkBase(s){var b={m:{},A:{},pol:JSON.stringify(s.pol)};COLS.forEach(function(c){var o={};(s[c[0]]||[]).forEach(function(x){o[x[c[1]]]=JSON.stringify(x)});b.m[c[0]]=o});Object.keys(s.A||{}).forEach(function(d){Object.keys(s.A[d]).forEach(function(e){b.A[d+"|"+e]=JSON.stringify(s.A[d][e])})});return b}
function diff(){if(!BASE)return null;var p={},any=0;COLS.forEach(function(c){var col=c[0],k=c[1],cur={},up=[],del=[];(D[col]||[]).forEach(function(x){cur[x[k]]=1;if(BASE.m[col][x[k]]!==JSON.stringify(x))up.push(x)});Object.keys(BASE.m[col]).forEach(function(key){if(!cur[key])del.push(key)});if(up.length||del.length){p[col]={up:up,del:del};any=1}});
var au=[];Object.keys(D.A||{}).forEach(function(d){Object.keys(D.A[d]).forEach(function(e){if(BASE.A[d+"|"+e]!==JSON.stringify(D.A[d][e]))au.push({d:d,e:+e,r:D.A[d][e]})})});if(au.length){p.A={up:au};any=1}

api("POST","/api/sync",{patch:p}).then(function(r){inflight=0;if(r.msgs&&r.msgs.length)toast(r.msgs[0]);if(dirty){BASE=mkBase(sent);flush();return}applyState(r.state,r.v)}).catch(function(e){inflight=0;if(e.status===401)return sessionEnd();dirty=1;toast("Connection problem – retrying…");setTimeout(flush,3000)})}
function mergeState(s){COLS.forEach(function(c){var col=c[0],k=c[1],old={};(D[col]||[]).forEach(function(x){old[x[k]]=x});D[col]=(s[col]||[]).map(function(n){var o=old[n[k]];if(!o)return n;Object.keys(o).forEach(function(p){if(!(p in n))delete o[p]});Object.assign(o,n);return o})});D.A=s.A||{};D.pol=s.pol}
